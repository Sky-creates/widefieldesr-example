[project]
name = "labplot"
version = "0.2.0"
description = "Lab-wide matplotlib plotting style: figure frame, colorbar styling, coolwarm colormaps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
