[project]
name = "widefieldesr"
version = "0.9.0"
description = "Widefield NV-ESR magnetometry imaging: .mat loading, contrast, ROI Lorentzian-dip fitting (CPU + CUDA), exact NV Hamiltonian, plotting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "lmfit>=1.2",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "torch>=2.7",
    "labplot",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
labplot = { path = "../labplot", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
